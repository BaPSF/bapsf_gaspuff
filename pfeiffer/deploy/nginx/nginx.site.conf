# nginx's drop-in, installed as /etc/systemd/system/nginx.service.d/site.conf (steps in pressure.nginx.example). Nothing
# in it differs per machine, so it is used as committed. The interferometer machine's copy also denies its scope network.
[Service]
# nginx binds the lab address itself: if that address is not up yet at boot the start fails, and this retries.
Restart=on-failure
RestartSec=5
# Light sandboxing that leaves nginx's own needs alone (it starts as root, binds port 80, then runs workers as
# www-data; it writes /var/log/nginx, /var/lib/nginx and /run).
ProtectHome=yes
PrivateTmp=yes
ProtectSystem=full
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
NoNewPrivileges=yes
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
